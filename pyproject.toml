[project]
name = "d2savior"
version = "0.1.0"
description = "Diablo II: Resurrected save and stash parser and extractor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
d2s-parse = "d2s_parse:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["d2s_parse"]
include-package-data = false
