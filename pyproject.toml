[project]
name = "d2savior"
version = "0.1.0"
description = "Diablo II: Resurrected save and stash parser and extractor"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[project.scripts]
d2s-parse = "d2s_parse:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["d2s_parse"]
include-package-data = false

[tool.ruff]
line-length = 100
exclude = [".agents", "docs"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RUF",
    "N",
    "PT",
    "ANN",
]
ignore = [
    "E501",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "RUF001", "RUF002", "RUF003"]
"data/**" = ["ANN", "RUF001", "RUF002", "RUF003"]
"core/**" = ["RUF001", "RUF002", "RUF003"]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
# Temporary ignores to be removed one rule per commit:
"invalid-argument-type" = "ignore"
"invalid-assignment" = "ignore"
"invalid-return-type" = "ignore"
"unresolved-attribute" = "ignore"

