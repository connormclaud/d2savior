[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d2savior"
version = "0.1.0"
description = "Diablo II: Resurrected save and stash parser and extractor"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "simshi", email = "simonshi@gmail.com" },
    { name = "Vitali Vinahradski", email = "vitali@vinahradski.de" },
]
keywords = ["diablo-2", "diablo-2-resurrected", "d2r", "d2s", "d2i", "save-parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs>=4.0.0",
    "tomlkit>=0.13.0",
]

[project.urls]
Repository = "https://github.com/connormclaud/d2savior"
Issues = "https://github.com/connormclaud/d2savior/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[project.scripts]
d2savior = "d2savior.cli:main"
d2s-parse = "d2savior.cli:main"
d2s_parse = "d2savior.cli:main"

[tool.ruff]
line-length = 100
exclude = [".agents", "docs"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RUF",
    "N",
    "PT",
    "ANN",
]
ignore = [
    "E501",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "RUF001", "RUF002", "RUF003"]
"d2savior/data/**" = ["ANN", "RUF001", "RUF002", "RUF003"]
"d2savior/core/**" = ["RUF001", "RUF002", "RUF003"]

[tool.ty.environment]
python-version = "3.15"
