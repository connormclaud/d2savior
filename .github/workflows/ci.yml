name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --no-default-features --locked
      - name: Build native extension
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --locked
          uv run python -c 'import shutil, sys; src, dst = {"darwin": ("lib_native.dylib", "_native.abi3.so"), "win32": ("_native.dll", "_native.pyd")}.get(sys.platform, ("lib_native.so", "_native.abi3.so")); shutil.copy2(f"rust/target/release/{src}", f"d2savior/{dst}")'
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run linter
        run: uv run ruff check .
      - name: Run static type checker
        run: uv run ty check
      - name: Run tests
        run: uv run pytest tests/ -v --cov=d2savior --cov-report=term-missing
